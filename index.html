<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Арбузы 🍉</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Арбузы">
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f0fdf4; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 450px; border: 2px solid #22c55e; margin-top: 10px; }
        h2 { text-align: center; color: #15803d; margin-top: 0; font-size: 26px; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #374151; font-weight: bold; font-size: 18px; }
        input { width: 100%; padding: 16px; border: 2px solid #cbd5e1; border-radius: 14px; font-size: 22px; outline: none; transition: border 0.2s; -moz-appearance: textfield; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input:focus { border-color: #22c55e; background-color: #fbfdfb; }
        .result-box { background: #dcfce7; padding: 20px; border-radius: 16px; text-align: center; margin-top: 25px; border: 1px solid #bbf7d0; }
        .result-box.change-box { background: #fef9c3; border-color: #fde047; margin-top: 15px; }
        .result-title { color: #166534; font-size: 18px; margin: 0; font-weight: 500; }
        .result-title.change-title { color: #854d0e; }
        .result-value { color: #15803d; font-size: 42px; font-weight: 900; margin: 5px 0 0 0; }
        .result-value.change-value { color: #a16207; }
        .error-message { color: #b91c1c; font-size: 20px; font-weight: 700; margin: 5px 0 0; }

        .payment-group { display: flex; gap: 20px; justify-content: center; margin: 15px 0; }
        .payment-group label { display: flex; align-items: center; gap: 8px; font-weight: normal; font-size: 18px; cursor: pointer; }
        .payment-group input[type="radio"] { width: 20px; height: 20px; accent-color: #22c55e; }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-group button { flex: 1; padding: 14px; border: none; border-radius: 14px; font-size: 20px; font-weight: bold; cursor: pointer; transition: background 0.2s, transform 0.1s; }
        .btn-add { background: #f59e0b; color: white; }
        .btn-add:active { background: #d97706; transform: scale(0.98); }
        .btn-pay { background: #22c55e; color: white; }
        .btn-pay:active { background: #15803d; transform: scale(0.98); }
        .btn-clear-cart { background: #ef4444; color: white; flex: 0.5; }
        .btn-clear-cart:active { background: #dc2626; }

        .cart-section { margin-top: 20px; border-top: 2px dashed #bbf7d0; padding-top: 15px; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .cart-header h3 { margin: 0; color: #166534; font-size: 18px; }
        .cart-stats { display: flex; gap: 15px; font-size: 16px; color: #374151; }
        .cart-stats span { font-weight: 600; color: #15803d; }
        .cart-items { max-height: 200px; overflow-y: auto; margin-top: 10px; }
        .cart-item { background: #f8fafc; border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; display: flex; justify-content: space-between; font-size: 15px; }
        .cart-item .item-weight { font-weight: 600; }
        .cart-empty { color: #9ca3af; text-align: center; padding: 10px; }

        .history-section { margin-top: 30px; border-top: 2px dashed #bbf7d0; padding-top: 20px; }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .history-header h3 { margin: 0; color: #166534; font-size: 20px; }
        .history-header button { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .history-list { max-height: 400px; overflow-y: auto; }
        .history-item { background: #f8fafc; border-radius: 12px; padding: 12px 15px; margin-bottom: 10px; border-left: 4px solid #22c55e; font-size: 15px; }
        .history-item .time { color: #6b7280; font-size: 13px; }
        .history-item .details { display: flex; flex-wrap: wrap; justify-content: space-between; margin-top: 4px; }
        .history-item .details span { margin-right: 10px; }
        .history-item .payment-badge { background: #dbeafe; color: #1e40af; padding: 2px 10px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .history-item .payment-badge.card { background: #e0e7ff; color: #3730a3; }
        .history-item .item-list { margin-top: 8px; padding-left: 10px; border-top: 1px dashed #d1d5db; padding-top: 6px; font-size: 14px; color: #374151; }
        .history-item .item-row { display: flex; justify-content: space-between; padding: 2px 0; }
        .empty-history { color: #9ca3af; text-align: center; padding: 20px 0; }
    </style>
</head>
<body>

<div class="card">
    <h2>🍉 Арбузный Помощник</h2>
    
    <div class="input-group">
        <label for="price">Цена за 1 кг (руб):</label>
        <input type="number" id="price" inputmode="decimal" placeholder="Цена" value="30">
    </div>

    <div class="input-group">
        <label for="weight">Вес арбуза (кг):</label>
        <input type="number" id="weight" inputmode="decimal" placeholder="0.00" autofocus>
    </div>

    <div class="payment-group">
        <label><input type="radio" name="payment" value="cash" checked> Наличные</label>
        <label><input type="radio" name="payment" value="card"> Карта</label>
    </div>

    <div class="input-group" id="cashGroup">
        <label for="cash">Сумма наличными (руб):</label>
        <input type="number" id="cash" inputmode="decimal" placeholder="0.00">
    </div>

    <div class="btn-group">
        <button class="btn-add" id="addBtn">➕ Добавить арбуз</button>
        <button class="btn-pay" id="payBtn">💳 Оплатить</button>
        <button class="btn-clear-cart" id="clearCartBtn">🗑️</button>
    </div>

    <div class="cart-section">
        <div class="cart-header">
            <h3>🛒 Корзина</h3>
            <div class="cart-stats">
                <span id="cartCount">0 шт.</span>
                <span id="cartTotalWeight">0.00 кг</span>
            </div>
        </div>
        <div class="cart-items" id="cartItems">
            <div class="cart-empty">Корзина пуста</div>
        </div>
        <div style="text-align: right; font-weight: bold; margin-top: 5px;" id="cartTotalPrice">Итого: 0.00 ₽</div>
    </div>

    <div class="result-box change-box" id="changeBox" style="display: none;">
        <p class="result-title change-title">Сдача / Недостача:</p>
        <p class="result-value change-value" id="changeDisplay">0 ₽</p>
    </div>

    <div class="history-section">
        <div class="history-header">
            <h3>📋 История продаж</h3>
            <button id="clearHistoryBtn">Очистить</button>
        </div>
        <div class="history-list" id="historyList">
            <div class="empty-history">Пока нет записей</div>
        </div>
    </div>
</div>

<script>
    // -------- Элементы --------
    const priceInput = document.getElementById('price');
    const weightInput = document.getElementById('weight');
    const cashInput = document.getElementById('cash');
    const paymentRadios = document.querySelectorAll('input[name="payment"]');
    const cashGroup = document.getElementById('cashGroup');
    const addBtn = document.getElementById('addBtn');
    const payBtn = document.getElementById('payBtn');
    const clearCartBtn = document.getElementById('clearCartBtn');
    const cartItems = document.getElementById('cartItems');
    const cartCount = document.getElementById('cartCount');
    const cartTotalWeight = document.getElementById('cartTotalWeight');
    const cartTotalPrice = document.getElementById('cartTotalPrice');
    const changeBox = document.getElementById('changeBox');
    const changeDisplay = document.getElementById('changeDisplay');
    const historyList = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');

    // -------- Состояние корзины --------
    let cart = [];

    // -------- Сохранение настроек --------
    function saveSettings() {
        localStorage.setItem('watermelon_price', priceInput.value);
        localStorage.setItem('watermelon_payment', document.querySelector('input[name="payment"]:checked').value);
    }

    function loadSettings() {
        const savedPrice = localStorage.getItem('watermelon_price');
        if (savedPrice !== null) priceInput.value = savedPrice;
        const savedPayment = localStorage.getItem('watermelon_payment');
        if (savedPayment !== null) {
            document.querySelectorAll('input[name="payment"]').forEach(radio => {
                radio.checked = (radio.value === savedPayment);
            });
        }
        toggleCashField();
    }

    // -------- Показ/скрытие поля наличных --------
    function toggleCashField() {
        const isCash = document.querySelector('input[name="payment"]:checked').value === 'cash';
        cashGroup.style.display = isCash ? 'block' : 'none';
        if (!isCash) cashInput.value = '';
        updateChangeDisplay();
    }
    paymentRadios.forEach(radio => radio.addEventListener('change', () => {
        toggleCashField();
        saveSettings();
        updateChangeDisplay();
    }));

    // -------- Обновление корзины --------
    function renderCart() {
        if (cart.length === 0) {
            cartItems.innerHTML = '<div class="cart-empty">Корзина пуста</div>';
            cartCount.textContent = '0 шт.';
            cartTotalWeight.textContent = '0.00 кг';
            cartTotalPrice.textContent = 'Итого: 0.00 ₽';
            changeBox.style.display = 'none';
            return;
        }
        let html = '';
        let totalWeight = 0;
        let totalPrice = 0;
        cart.forEach((item) => {
            const cost = item.weight * item.price;
            totalWeight += item.weight;
            totalPrice += cost;
            html += `<div class="cart-item">
                <span class="item-weight">${item.weight.toFixed(2)} кг</span>
                <span>${item.price.toFixed(2)} ₽/кг = ${cost.toFixed(2)} ₽</span>
            </div>`;
        });
        cartItems.innerHTML = html;
        cartCount.textContent = cart.length + ' шт.';
        cartTotalWeight.textContent = totalWeight.toFixed(2) + ' кг';
        cartTotalPrice.textContent = 'Итого: ' + totalPrice.toFixed(2) + ' ₽';
        changeBox.style.display = 'block';
        updateChangeDisplay();
    }

    // -------- Расчёт сдачи --------
    function updateChangeDisplay() {
        if (cart.length === 0) {
            changeDisplay.textContent = '0 ₽';
            changeDisplay.className = 'result-value change-value';
            return;
        }
        const total = cart.reduce((sum, item) => sum + item.weight * item.price, 0);
        const isCash = document.querySelector('input[name="payment"]:checked').value === 'cash';
        let cash = 0;
        if (isCash) {
            cash = parseFloat(cashInput.value) || 0;
        } else {
            cash = total;
        }
        const change = cash - total;
        if (total === 0 && cash === 0) {
            changeDisplay.textContent = '0 ₽';
            changeDisplay.className = 'result-value change-value';
            return;
        }
        if (change >= 0) {
            changeDisplay.textContent = change.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₽';
            changeDisplay.className = 'result-value change-value';
        } else {
            changeDisplay.textContent = 'Не хватает ' + Math.abs(change).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₽';
            changeDisplay.className = 'error-message';
        }
    }

    // -------- Добавление арбуза --------
    function addWatermelon() {
        const price = parseFloat(priceInput.value) || 0;
        const weight = parseFloat(weightInput.value) || 0;
        if (price <= 0 || weight <= 0) {
            alert('Укажите цену и вес (больше 0).');
            return;
        }
        cart.push({ weight, price });
        renderCart();
        weightInput.value = '';
        weightInput.focus();
        saveSettings();
        updateChangeDisplay();
    }

    // -------- Очистка корзины --------
    function clearCart() {
        if (cart.length === 0) return;
        if (confirm('Очистить корзину?')) {
            cart = [];
            renderCart();
            changeBox.style.display = 'none';
            weightInput.focus();
        }
    }

    // -------- Оплата --------
    function pay() {
        if (cart.length === 0) {
            alert('Корзина пуста. Добавьте арбузы.');
            return;
        }
        const total = cart.reduce((sum, item) => sum + item.weight * item.price, 0);
        const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
        let cashGiven = 0;
        let change = 0;
        if (paymentMethod === 'cash') {
            cashGiven = parseFloat(cashInput.value) || 0;
            change = cashGiven - total;
            if (change < 0) {
                alert('Недостаточно наличных! Проверьте сумму.');
                return;
            }
        } else {
            cashGiven = total;
            change = 0;
        }

        const record = {
            id: Date.now() + Math.random(),
            timestamp: new Date().toISOString(),
            items: cart.map(item => ({ weight: item.weight, price: item.price })),
            total: total,
            paymentMethod: paymentMethod,
            cashGiven: cashGiven,
            change: change,
            totalWeight: cart.reduce((sum, item) => sum + item.weight, 0),
            count: cart.length
        };

        const history = loadHistory();
        history.push(record);
        saveHistory(history);
        renderHistory();

        cart = [];
        renderCart();
        changeBox.style.display = 'none';
        weightInput.value = '';
        weightInput.focus();
        saveSettings();
        toggleCashField();
        payBtn.style.background = '#16a34a';
        setTimeout(() => payBtn.style.background = '#22c55e', 300);
    }

    // -------- История --------
    const STORAGE_KEY = 'watermelon_sales_history';

    function loadHistory() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
    }
    function saveHistory(history) { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); }

    function renderHistory() {
        const history = loadHistory();
        historyList.innerHTML = '';
        if (history.length === 0) {
            historyList.innerHTML = '<div class="empty-history">Пока нет записей</div>';
            return;
        }
        history.slice().reverse().forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            const date = new Date(item.timestamp);
            const timeStr = date.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const paymentLabel = item.paymentMethod === 'cash' ? 'Наличные' : 'Карта';
            const badgeClass = item.paymentMethod === 'cash' ? '' : 'card';
            let changeText = '';
            if (item.paymentMethod === 'cash' && item.change > 0) changeText = `, сдача ${item.change.toFixed(2)} ₽`;
            else if (item.paymentMethod === 'cash' && item.change === 0) changeText = ', без сдачи';
            const count = item.count || (item.items ? item.items.length : 1);
            const weightSummary = item.totalWeight ? item.totalWeight.toFixed(2) : (item.items ? item.items.reduce((s, i) => s + i.weight, 0).toFixed(2) : '?');

            // Верхняя часть: время, количество, вес, сумма
            let html = `
                <div class="time">${timeStr}</div>
                <div class="details">
                    <span>${count} арб. (${weightSummary} кг)</span>
                    <span><strong>${item.total.toFixed(2)} ₽</strong></span>
                </div>
                <div class="details">
                    <span><span class="payment-badge ${badgeClass}">${paymentLabel}</span></span>
                    <span>${changeText}</span>
                </div>
            `;

            // Если есть детали по каждому арбузу
            if (item.items && item.items.length > 0) {
                html += `<div class="item-list">`;
                item.items.forEach(i => {
                    const cost = (i.weight * i.price);
                    html += `<div class="item-row">
                        <span>${i.weight.toFixed(2)} кг × ${i.price.toFixed(2)} ₽/кг</span>
                        <span>${cost.toFixed(2)} ₽</span>
                    </div>`;
                });
                html += `</div>`;
            }

            div.innerHTML = html;
            historyList.appendChild(div);
        });
    }

    function clearHistory() {
        if (confirm('Удалить всю историю продаж?')) {
            saveHistory([]);
            renderHistory();
        }
    }

    // -------- Обработчики --------
    addBtn.addEventListener('click', addWatermelon);
    payBtn.addEventListener('click', pay);
    clearCartBtn.addEventListener('click', clearCart);
    clearHistoryBtn.addEventListener('click', clearHistory);
    cashInput.addEventListener('input', updateChangeDisplay);
    priceInput.addEventListener('input', () => {
        saveSettings();
        renderCart();
    });
    paymentRadios.forEach(radio => radio.addEventListener('change', () => {
        toggleCashField();
        updateChangeDisplay();
    }));

    // -------- Инициализация --------
    loadSettings();
    renderCart();
    renderHistory();
    changeBox.style.display = 'none';
</script>
</body>
</html>
